<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple BookMyShow</title>
  
  <!-- CSS STYLES -->
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #a2d6ea;
      padding: 20px;
    }

    /* Container for Movie Cards */
    .movie-list {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    /* Individual Movie Box */
    .movie-card {
      background: rgb(149, 129, 238);
      border: 2px solid #2015e2;
      border-radius: 8px;
      padding: 15px;
      width: 150px;
      cursor: pointer;
    }

    .movie-card:hover {
      border-color: #ff4757;
    }

    /* Section for Seats */
    #booking-section {
      display: none; /* Hidden until a movie is clicked */
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      margin: 0 auto;
    }

    /* Seats Container */
    .seats-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    /* Single Seat Style */
    .seat {
      width: 40px;
      height: 40px;
      background-color: #ddd;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Selected Seat Style */
    .seat.selected {
      background-color: #2ed573;
      color: white;
    }

    /* Screen Indicator */
    .screen {
      background: #333;
      color: white;
      padding: 5px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>🎬 Movie Ticket Booking</h1>
  <p>Click on a movie to select your seats:</p>

  <!-- 1. THREE MOVIES -->
  <div class="movie-list">
    <div class="movie-card" onclick="selectMovie('Avengers', 200)">
      <h3>Avengers</h3>
      <p>Price: ₹200</p>
    </div>

    <div class="movie-card" onclick="selectMovie('Avatar', 250)">
      <h3>Avatar</h3>
      <p>Price: ₹250</p>
    </div>

    <div class="movie-card" onclick="selectMovie('Inception', 180)">
      <h3>Inception</h3>
      <p>Price: ₹180</p>
    </div>
  </div>

  <!-- 2. BOOKING SECTION (SEATS & TOTAL) -->
  <div id="booking-section">
    <h2 id="movie-title">Movie Name</h2>
    <p>Price per seat: ₹<span id="ticket-price">0</span></p>

    <div class="screen">SCREEN THIS WAY</div>

    <!-- 10 SEATS -->
    <div class="seats-container">
      <div class="seat" onclick="toggleSeat(this)">1</div>
      <div class="seat" onclick="toggleSeat(this)">2</div>
      <div class="seat" onclick="toggleSeat(this)">3</div>
      <div class="seat" onclick="toggleSeat(this)">4</div>
      <div class="seat" onclick="toggleSeat(this)">5</div>
      <div class="seat" onclick="toggleSeat(this)">6</div>
      <div class="seat" onclick="toggleSeat(this)">7</div>
      <div class="seat" onclick="toggleSeat(this)">8</div>
      <div class="seat" onclick="toggleSeat(this)">9</div>
      <div class="seat" onclick="toggleSeat(this)">10</div>
    </div>

    <h3>Total Price: ₹<span id="total-price">0</span></h3>
  </div>

  <!-- JAVASCRIPT CODE -->
  <script>
    let currentPrice = 0;
    let selectedSeatsCount = 0;

    // Function called when a movie is clicked
    function selectMovie(title, price) {
      currentPrice = price;
      
      // Update heading and price text
      document.getElementById('movie-title').innerText = title;
      document.getElementById('ticket-price').innerText = price;
      
      // Show the booking section
      document.getElementById('booking-section').style.display = 'block';

      // Reset seat selections
      resetSeats();
    }

    // Function called when a seat is clicked
    function toggleSeat(seatElement) {
      // Toggle 'selected' class on seat
      seatElement.classList.toggle('selected');

      // Count all selected seats
      const allSelectedSeats = document.querySelectorAll('.seat.selected');
      selectedSeatsCount = allSelectedSeats.length;

      // Update total price
      updateTotal();
    }

    // Update total price calculation
    function updateTotal() {
      let total = selectedSeatsCount * currentPrice;
      document.getElementById('total-price').innerText = total;
    }

    // Reset all seats when switching movies
    function resetSeats() {
      const seats = document.querySelectorAll('.seat');
      seats.forEach(seat => seat.classList.remove('selected'));
      selectedSeatsCount = 0;
      updateTotal();
    }
  </script>

</body>
</html>
