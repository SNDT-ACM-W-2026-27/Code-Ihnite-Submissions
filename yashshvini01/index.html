<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora | the retro arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Nexora</h1>
    <p class="tagline">the retro arcade</p>
  </header>

  <main>
    <section id="menu">
      <p class="hint">Pick a game to play</p>
      <div class="tiles">
        <button class="tile" data-game="tictactoe"><span class="icon">⭕</span>Tic-Tac-Toe</button>
        <button class="tile" data-game="guess"><span class="icon">🔢</span>Number Guessing</button>
        <button class="tile" data-game="target"><span class="icon">🎯</span>Click the Target</button>
        <button class="tile" data-game="rps"><span class="icon">✂️</span>Rock Paper Scissors</button>
      </div>
    </section>

    <section id="screen" class="panel" hidden></section>
    <button id="back" class="btn ghost" hidden>← Back to menu</button>
  </main>

  <footer>Nexora · made by TEAM ROCKET</footer>

  <script src="tictactoe.js"></script>
  <script src="guess.js"></script>
  <script src="target.js"></script>
  <script src="rps.js"></script>
  <script src="main.js"></script>
</body>
</html>
